<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heaven Plaza Scanner</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px;
      margin: 0;
      background-color: #f1f3f4;
      box-sizing: border-box;
      line-height: 1.5;
    }
    h2 {
      color: #202124;
      margin: 4px 0 4px 0;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
    }
    .dev-credit {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 14px;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }
    .top-badges {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      width: 100%;
    }
    #netStatus, #deviceBadge {
      font-size: 14px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 18px;
      line-height: 1.4;
    }
    #deviceBadge {
      background-color: #e8eaed;
      color: #3c4043;
      border: 1px solid #dadce0;
      user-select: none;
    }
    .online-badge { background-color: #e6f4ea; color: #137333; }
    .offline-badge { background-color: #fce8e6; color: #c5221f; }
    
    /* One-Time Permanent Registration Card */
    #setupCard {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      box-sizing: border-box;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      text-align: center;
      display: none;
      border: 2px solid #1a73e8;
      line-height: 1.5;
    }
    #setupCard h3 {
      margin: 0 0 8px 0;
      color: #202124;
      font-size: 18px;
    }
    #setupCard p {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #c5221f;
      font-weight: 600;
    }
    #nameInput {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .lock-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background-color: #137333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Camera Box */
    #reader {
      width: 100%;
      max-width: 300px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    .btn {
      margin-top: 14px;
      padding: 13px 20px;
      font-size: 17px;
      font-weight: bold;
      color: #fff;
      background-color: #1a73e8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    #status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      max-width: 350px;
      width: 100%;
      box-sizing: border-box;
      background-color: #fff;
      color: #5f6368;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      white-space: pre-line;
      line-height: 1.5;
    }
    #queueBox {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background-color: #e8f0fe;
      color: #1967d2;
      border: 1px solid #d2e3fc;
      max-width: 350px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: none;
      line-height: 1.5;
    }
    .success { background-color: #e6f4ea !important; color: #137333 !important; }
    .loading { background-color: #e8f0fe !important; color: #1967d2 !important; }
    .warning { background-color: #fef7e0 !important; color: #b06000 !important; }
    .error { background-color: #fce8e6 !important; color: #c5221f !important; }
  </style>
</head>
<body>

  <h2>Heaven Plaza Scanner</h2>
  <div class="dev-credit">(Developed by : Azim Bhayani)</div>
  
  <div class="top-badges">
    <div id="netStatus" class="online-badge">🟢 Online</div>
    <div id="deviceBadge">🔒 Unregistered Mobile</div>
  </div>

  <!-- One-Time Registration Card (Disappears forever once saved) -->
  <div id="setupCard">
    <h3>One-Time Mobile Registration</h3>
    <p>⚠️ Warning: Once saved, this name is permanently locked to this phone and cannot be changed.</p>
    <input type="text" id="nameInput" placeholder="Enter Your Name / Mobile No.">
    <button class="lock-btn" onclick="lockUserName()">🔒 Lock & Save Permanently</button>
  </div>

  <div id="reader"></div>
  <button id="startBtn" class="btn" onclick="initScanner()">🔊 Tap to Start Scanner</button>
  
  <div id="status">Tap the button above to enable sound & camera</div>

  <div id="queueBox">
    🔄 <span id="queueText">0 scan(s) auto-syncing...</span>
  </div>

  <script>
    // 👇 PASTE YOUR GOOGLE APPS SCRIPT '/exec' URL BELOW 👇
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRX5IYn-lAafoGPePBgUtc3ae9zTSrbK3MsZje7pGQI9Glj1JQcJOcBVc1PxFvXtZ6Yg/exec";
    const STORAGE_KEY = "offline_qr_scans_queue";
    const USER_NAME_KEY = "scanner_locked_user_name";
    const DEVICE_TOKEN_KEY = "scanner_locked_device_token";
    
    const SCAN_COOLDOWN_MS = 1200; 
    const SAME_CODE_DEBOUNCE_MS = 5000;

    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const netStatus = document.getElementById('netStatus');
    const deviceBadge = document.getElementById('deviceBadge');
    const setupCard = document.getElementById('setupCard');
    const nameInput = document.getElementById('nameInput');
    const queueBox = document.getElementById('queueBox');
    const queueText = document.getElementById('queueText');
    const html5QrCode = new Html5Qrcode("reader");

    let isCooldown = false;
    let isSyncing = false;
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let audioCtx = null;

    // --- 0. DUAL-STORAGE (LOCALSTORAGE + 10-YEAR COOKIE) LOCK ---
    function setPermanentValue(key, val) {
      localStorage.setItem(key, val);
      const d = new Date();
      d.setTime(d.getTime() + (3650 * 24 * 60 * 60 * 1000));
      document.cookie = `${key}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
    }

    function getPermanentValue(key) {
      let val = localStorage.getItem(key);
      if (!val) {
        const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
        if (match) {
          val = decodeURIComponent(match[2]);
          localStorage.setItem(key, val);
        }
      }
      return val;
    }

    function getDeviceOS() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return "AND";
      if (/iPad|iPhone|iPod/.test(ua)) return "IOS";
      return "DEV";
    }

    function getOrCreateDeviceToken() {
      let token = getPermanentValue(DEVICE_TOKEN_KEY);
      if (!token) {
        const rand = Math.random().toString(36).substring(2, 6).toUpperCase() + "-" +
                     Math.random().toString(36).substring(2, 6).toUpperCase();
        token = `${getDeviceOS()}-${rand}`;
        setPermanentValue(DEVICE_TOKEN_KEY, token);
      }
      return token;
    }

    function getLockedUserName() {
      return getPermanentValue(USER_NAME_KEY);
    }

    function checkRegistrationState() {
      const token = getOrCreateDeviceToken();
      const lockedName = getLockedUserName();

      if (lockedName) {
        setupCard.style.display = 'none';
        startBtn.style.display = 'block';
        deviceBadge.innerText = `🔒 User: ${lockedName} (${token})`;
      } else {
        setupCard.style.display = 'block';
        startBtn.style.display = 'none';
        statusDiv.className = 'warning';
        statusDiv.innerText = '⚠️ Complete one-time registration above to unlock scanner.';
      }
    }

    function lockUserName() {
      const entered = nameInput.value.trim();
      if (entered.length < 2) {
        alert("Please enter your valid Name or Mobile ID.");
        return;
      }
      const confirmLock = confirm(`Are you sure you want to lock this phone to "${entered}"?\n\nYou will NOT be able to change this later.`);
      if (!confirmLock) return;

      setPermanentValue(USER_NAME_KEY, entered);
      checkRegistrationState();
      statusDiv.className = 'success';
      statusDiv.innerText = `✅ Phone permanently registered to ${entered}!\nTap "Start Scanner" above.`;
    }

    // --- 1. LOCAL STORAGE QUEUE HELPERS ---
    function getQueue() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveQueue(queue) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
      updateQueueUI();
    }

    function addToQueue(scanItem) {
      const queue = getQueue();
      queue.push(scanItem);
      saveQueue(queue);
    }

    function updateQueueUI() {
      const queue = getQueue();
      if (queue.length > 0) {
        queueBox.style.display = 'block';
        if (navigator.onLine) {
          queueText.innerText = `${queue.length} scan(s) auto-uploading to Sheet...`;
        } else {
          queueText.innerText = `${queue.length} scan(s) stored offline (will auto-upload)`;
        }
      } else {
        queueBox.style.display = 'none';
      }
    }

    // --- 2. BEEP SOUND ---
    function playBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // --- 3. INSTANT NON-BLOCKING QR SCAN ---
    function handleScan(decodedText) {
      const lockedName = getLockedUserName();
      if (!lockedName) {
        checkRegistrationState();
        return;
      }

      const now = Date.now();
      if (isCooldown) return;
      if (decodedText === lastScannedCode && (now - lastScannedTime) < SAME_CODE_DEBOUNCE_MS) {
        return;
      }

      isCooldown = true;
      lastScannedCode = decodedText;
      lastScannedTime = now;

      playBeep();
      if (navigator.vibrate) navigator.vibrate(150);

      const scanItem = {
        scannedText: decodedText,
        scanTime: new Date().toISOString(),
        userName: lockedName,
        deviceToken: getOrCreateDeviceToken()
      };

      addToQueue(scanItem);

      statusDiv.className = 'success';
      statusDiv.innerText = `✅ Scanned: ${decodedText}\nReady for next scan in 1s...`;

      setTimeout(() => {
        isCooldown = false;
        statusDiv.className = '';
        statusDiv.innerText = `🟢 Ready! Point at next QR code\n(Last: ${decodedText})`;
      }, SCAN_COOLDOWN_MS);

      syncQueueInBackground();
    }

    // --- 4. HANDS-FREE AUTO-UPLOAD WORKER ---
    async function syncQueueInBackground() {
      if (isSyncing || !navigator.onLine) return;
      if (getQueue().length === 0) return;

      isSyncing = true;
      updateQueueUI();

      while (getQueue().length > 0 && navigator.onLine) {
        const currentQueue = getQueue();
        const itemToUpload = currentQueue[0];

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(itemToUpload),
            cache: 'no-store'
          });
          const result = await response.json();

          if (result.success) {
            const updatedQueue = getQueue();
            updatedQueue.shift();
            saveQueue(updatedQueue);
          } else {
            break;
          }
        } catch (err) {
          break;
        }
      }

      isSyncing = false;
      updateQueueUI();
    }

    // --- 5. AUTOMATIC RECONNECT & 3-SECOND HEARTBEAT ---
    function updateNetworkBadge() {
      if (navigator.onLine) {
        netStatus.className = 'online-badge';
        netStatus.innerText = '🟢 Online (Auto-Sync)';
        updateQueueUI();
        syncQueueInBackground();
        setTimeout(syncQueueInBackground, 2000);
      } else {
        netStatus.className = 'offline-badge';
        netStatus.innerText = '🔴 Offline (Saving to Phone)';
        updateQueueUI();
      }
    }

    window.addEventListener('online', updateNetworkBadge);
    window.addEventListener('offline', updateNetworkBadge);

    setInterval(() => {
      if (navigator.onLine && getQueue().length > 0 && !isSyncing) {
        syncQueueInBackground();
      }
    }, 3000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && navigator.onLine) {
        syncQueueInBackground();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkRegistrationState();
      updateQueueUI();
      updateNetworkBadge();
    });

    // --- 6. START CAMERA (Compact 1:1 Square View) ---
    function initScanner() {
      if (!getLockedUserName()) {
        checkRegistrationState();
        return;
      }

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      playBeep();

      startBtn.style.display = 'none';
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Starting camera...';

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 200, height: 200 }, aspectRatio: 1.0 },
        (decodedText) => { handleScan(decodedText); },
        (errorMessage) => { /* ignore empty frames */ }
      ).then(() => {
        statusDiv.className = '';
        statusDiv.innerText = '🟢 Ready! Point rear camera at QR code';
      }).catch(err => {
        startBtn.style.display = 'block';
        statusDiv.className = 'error';
        statusDiv.innerText = 'Camera error: ' + err;
      });
    }

    // --- 7. REGISTER OFFLINE SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Offline Service Worker registered!'))
          .catch(err => console.error('Service Worker failed:', err));
      });
    }
  </script>

</body>
</html>
